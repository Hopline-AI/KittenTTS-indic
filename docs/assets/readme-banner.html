}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1500px; height: 500px; overflow: hidden; background: var(--background); }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.canvas { position: relative; width: 1500px; height: 500px; overflow: hidden; background: var(--background); }
.grid { position: absolute; inset: 0;
  background-image: radial-gradient(circle, var(--hairline) 1.3px, transparent 1.6px);
  background-size: 28px 28px; background-position: 14px 14px; opacity: .75; }
.rule { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--primary); opacity: .72; }
.motif { position: absolute; right: 60px; top: 126px; width: 520px; height: 300px; }
.header { position: absolute; top: 72px; left: 96px; right: 96px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand svg { width: 58px; height: 58px; color: var(--primary); }
.word { font-weight: 800; font-size: 32px; letter-spacing: -0.02em; }
.by { font-weight: 500; font-size: 19px; color: var(--ink-faint); margin-left: 4px; position: relative; top: 2px; }
.by b { font-weight: 700; color: var(--ink-soft); }
.pill { font-weight: 600; font-size: 19px; color: var(--primary); background: var(--secondary-container);
  padding: 11px 22px; border-radius: 999px; opacity: .92; }
.main { position: absolute; left: 96px; top: 166px; width: 900px; }
h1 { font-weight: 800; font-size: 64px; line-height: 1.05; letter-spacing: -0.028em; }
h1 em { font-style: normal; color: var(--primary); }
p.sub { margin-top: 20px; font-size: 21px; line-height: 1.5; color: var(--ink-soft); max-width: 860px; }
.footer { position: absolute; left: 96px; bottom: 44px; font-size: 20px; color: var(--ink-faint); display: flex; align-items: center; gap: 12px; }
.footer b { font-weight: 700; color: var(--ink); }
.footer .mono { font-family: var(--mono); font-size: 16px; color: var(--ink-soft); }
.footer .sep { color: var(--outline-variant); }
</style></head>
